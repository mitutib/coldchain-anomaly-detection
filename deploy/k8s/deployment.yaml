apiVersion: apps/v1
kind: Deployment
metadata:
  name: coldchain
  namespace: coldchain
spec:
  # detector state is in memory, so a second replica would see only part of each sensor's readings
  replicas: 1
  selector:
    matchLabels:
      app: coldchain
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: coldchain
    spec:
      containers:
        - name: coldchain
          image: coldchain:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: COLDCHAIN_OFFSET
              value: "1.0"
            - name: COLDCHAIN_N
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
