[project]
name = "coldchain"
version = "0.1.0"
description = "Anomaly detection for refrigeration temperature sensors"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = ["numpy", "scikit-learn"]
service = ["fastapi", "uvicorn", "prometheus-client", "redis"]
dev = ["coldchain[model,service]", "pytest", "httpx", "fakeredis", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
